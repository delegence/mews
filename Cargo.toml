[workspace]
members = [
    "crates/mews",
    "crates/mews-acp",
    "crates/mews-agent",
    "crates/mews-client",
    "crates/mews-channel",
    "crates/mews-host",
    "crates/mews-protocol",
    "crates/mews-relay",
    "crates/mews-router",
    "crates/mews-runtime",
    "crates/mews-store",
    "crates/mews-transport",
    "crates/mews-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
fs2 = "0.4"
futures-util = "0.3"
jsonschema = "0.33"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
indicatif = "0.18"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = "0.28"
toml = "0.9"
uuid = { version = "1.17", features = ["serde", "v5", "v7"] }
zeroize = "1.8"

[profile.release]
strip = true
lto = "thin"
